<! DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Airball Photos</title>
    <meta name="description" content="Photo gallery from Airball games, leagues, and championships">
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Dark mode toggle -->
<button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
    <svg class="theme-toggle-icon" fill="currentColor" viewBox="0 0 20 20">
        <path class="sun-icon" d="M10 2L13.09 8.26L20 9L14 14.74L15.18 21.02L10 17.77L4.82 21.02L6 14.74L0 9L6.91 8.26L10 2Z"/>
        <path class="moon-icon" style="display: none;" d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
    </svg>
</button>

<!-- Floating Navbar -->
<nav class="navbar" id="navbar" role="navigation" aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="leagues.html">Leagues</a>
    <a href="champions.html">Champions</a>
    <a href="photos.html">Photos</a>
    <a class="special" href="https://classy-cairnsmore-f09.notion.site/21657819ab6080a3bfc2e7d1bb091dd8?pvs=105"
       target="_blank" rel="noopener noreferrer">Championship</a>
</nav>
<br>
<br>

<!-- Main Content -->
<main class="main-content" id="main-content">
    <div class="page-header">
        <h1>Airball Photos</h1>
        <div class="photo-gallery" id="photo-gallery"></div>


</main>

<!-- Footer -->
<footer class="site-footer">
    <div class="footer-content">
        <img src="logo_main.png" alt="Airball Logo" class="footer-logo" loading="lazy">
        <p>&copy; 2025 Airball. Fast-paced, strategic, and fun for everyone.</p>
        <nav class="footer-nav" aria-label="Footer navigation">
            <a href="index.html">Home</a>
            <a href="leagues.html">Leagues</a>
            <a href="champions.html">Champions</a>
            <a href="photos.html">Photos</a>
        </nav>
    </div>
</footer>

<script>
    // Dark mode functionality
    const themeToggle = document.getElementById('theme-toggle');
    const sunIcon = document.querySelector('.sun-icon');
    const moonIcon = document.querySelector('.moon-icon');

    const currentTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', currentTheme);

    if (currentTheme === 'dark') {
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'block';
    }

    themeToggle.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);

        if (newTheme === 'dark') {
            sunIcon.style.display = 'none';
            moonIcon.style.display = 'block';
        } else {
            sunIcon.style.display = 'block';
            moonIcon.style.display = 'none';
        }
    });

    // Navbar scroll behavior
    let ticking = false;
    function updateNavbar() {
        const navbar = document.getElementById('navbar');
        if (window.pageYOffset > 100) {
            navbar.classList.add('navbar-scrolled');
        } else {
            navbar.classList.remove('navbar-scrolled');
        }
        ticking = false;
    }
    window.addEventListener('scroll', function() {
        if (!ticking) {
            requestAnimationFrame(updateNavbar);
            ticking = true;
        }
    });

    // Hide broken images
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('img').forEach(img => {
            img.addEventListener('error', function() {
                this.style.display = 'none';
                console.warn('Failed to load image:', this.src);
            });
        });
    });

    // Auto-load all photos from the /photos folder via GitHub API
    fetch('https://api.github.com/repos/quantumsoldship/quantumsoldship.github.io/contents/photos')
        .then(response => response.json())
        .then(files => {
            const gallery = document.getElementById('photo-gallery');
            const imageExtensions = /\.(png|jpe?g|gif|webp|avif)$/i;

            files
                .filter(file => imageExtensions.test(file.name))
                .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }))
                .forEach(file => {
                    const figure = document.createElement('figure');
                    figure.className = 'photo-card';

                    const img = document.createElement('img');
                    img.src = 'photos/' + file.name;
                    img.alt = 'Airball game moment';
                    img.loading = 'lazy';

                    figure.appendChild(img);
                    gallery.appendChild(figure);
                });
        })
        .catch(error => console.warn('Could not load photos:', error));
</script>
</body>
</html>
